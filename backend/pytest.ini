[pytest]
testpaths = tests
python_files = test_*.py
# No class-based tests exist anywhere in this suite (function-based only) —
# disabling class collection avoids spurious PytestCollectionWarning noise
# whenever a test file imports a domain model that happens to start with
# "Test" (e.g. judge domain's TestCaseSpec/TestGroupSpec/TestCaseResult).
python_classes =
addopts = -q

