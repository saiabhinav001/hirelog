name: Exams CI

# Checks for the HireLog Exams service (backend/app/exam_main.py + the /exams
# frontend). It complements ci.yml rather than replacing it: ci.yml keeps
# validating the legacy HireLog backend, while this workflow validates the exam
# API against ONLY its own slim, hash-pinned dependency set. Nothing here
# deploys or pushes anything.

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/exams-ci.yml"
  push:
    branches:
      - "exams/**"
      - "hardening/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exams-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Exam API lint and tests (slim dependency set)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-exams.lock
            backend/requirements-dev.txt

      - name: Install the exam API's own dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-exams.lock
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        # test_concurrency and test_experience_lifecycle belong to the legacy
        # search backend and need its ML stack, which the exam image deliberately
        # does not ship (the slim-import test enforces that).
        run: PYTHONPATH=. pytest --ignore=tests/test_concurrency.py --ignore=tests/test_experience_lifecycle.py

      - name: Verify the backend compiles
        run: python -m compileall -q app

  security:
    name: Dependency and SAST scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        run: python -m pip install --upgrade pip pip-audit bandit

      - name: Audit the exam API's pinned dependencies (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements-exams.lock --no-deps --disable-pip

      - name: Python SAST (bandit, medium and above)
        working-directory: backend
        run: bandit -r app -ll

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit shipped frontend dependencies (npm audit)
        # Production dependencies only: dev tooling is never deployed.
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend lint, type-check, unit tests, staging build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:ci

      - name: Build (staging configuration)
        run: npm run build
        env:
          NEXT_PUBLIC_EXAMS_ENABLED: "true"
          NEXT_PUBLIC_EXAMS_STAGING: "true"
          NEXT_PUBLIC_EXAMS_API_BASE_URL: https://exams-staging.invalid

  image:
    name: Exam API image builds and boots
    runs-on: ubuntu-latest
    needs:
      - backend
    steps:
      - uses: actions/checkout@v4

      - name: Build the image from the hash-pinned lock
        run: docker build -f backend/Dockerfile.exams -t exams-api:ci backend

      - name: Boot without credentials and probe liveness
        run: |
          docker run -d --name exams-api -p 7862:7862 -e EXAMS_ENABLED=true -e ENV=development exams-api:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7862/health/live && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:7862/health/live

      - name: The image must not carry the legacy ML stack
        run: |
          docker exec exams-api python -c "import sys, app.exam_main; heavy = [m for m in ('numpy', 'faiss', 'spacy', 'torch', 'sentence_transformers', 'onnxruntime') if m in sys.modules]; assert not heavy, heavy"
